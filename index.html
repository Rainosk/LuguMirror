<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泸沽·镜 | Lugu Mirror</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="index-page">

    <!-- 背景音乐 -->
    <audio id="bgm" src="audio/MoonlakeWaiting.mp3" loop></audio>

    <!-- 主概念图（占满全屏） -->
    <img src="images/主概念图.png" alt="泸沽·镜" class="index-bg">

    <!-- 右上角图标区：音乐开关 + 详情简介 -->
    <div class="index-icons">
        <button id="musicToggle" class="icon-btn" title="音乐开关">
            <img src="images/icon-music-on.png" alt="音乐">
        </button>
        <button id="infoToggle" class="icon-btn" title="详情简介">
            <img src="images/icon-info.png" alt="详情">
        </button>
    </div>

    <!-- 详情简介面板（默认隐藏） -->
    <div id="infoPanel" class="info-panel">
        <div class="info-panel-inner">
            <button id="infoClose" class="info-close" title="关闭">×</button>
            <h2>泸沽·镜</h2>
            <p>一个关于摩梭文化的沉浸式科普作品</p>
            <p>视觉小说 * 视听博物馆</p>
            <div class="info-footer">溪呐咪制作组</div>
        </div>
    </div>

    <!-- 踏上旅程 -->
    <div class="journey-btn" onclick="location.href='overview.html'">
        踏上旅程
    </div>

    <script src="js/index.js"></script>

</body>

</html>
